<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>

    <title>email subscribe</title>
  </head>
  <body>
    <div class="h-screen bg-zinc-700 flex justify-center items-center">
      <div
        class="bg-zinc-800 p-2 max-w-sm md:max-w-2xl mx-auto flex flex-col justify-center rounded-lg items-center md:flex-row"
      >
        <img
          src="./images/image.jpg"
          alt="bean"
          class="object-fit h-80 rounded-l-lg w-full"
        />
        <div class="flex flex-col justify-center p-8 gap-4 text-center">
          <h1 class="font-serif text-white text-xl font-semibold">
            Get diet and fitness tips in your inbox
          </h1>
          <p class="text-white">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Hic,
            veritatis.
          </p>

          <form class="flex flex-col md:flex gap-4">
            <input
              type="text"
              class="bg-zinc-800 outline outline-1 outline-zinc-600 h-8 text-center text-sm"
              placeholder="your-email"
            />
            <button
              class="bg-lime-500 py-3 px-6 rounded-lg text-md tracking-wide"
            >
              Subscribe
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
