<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Colors</title>
  </head>
  <body>
    <!-- Default colors -->
    <!-- white, black, red, green, blue, orange, yellow, purple, lime, emerald, teal, cyan, indigo, violet, fuchsia, pink, rose, sky, gray, slate, zinc, neutral, stone, amber,  -->

    <!-- Text Colors -->
    <p class="text-black">Tailwind is awsome</p>
    <p class="text-white">Tailwind is awsome</p>
    <p class="text-red-500 capitalize">tailwind is awsome</p>

    <!-- Background Colors -->
    <p class="bg-slate-400">Tailwind is awsome</p>
    <p class="bg-indigo-400">Tailwind is awsome</p>
    <p class="bg-zinc-600">Tailwind is awsome</p>

    <!-- Text Underline -->

    <p class="underline decoration-emerald-600">Tailwind is awsome</p>
    <p class="underline decoration-yellow-600">Tailwind is awsome</p>
    <p class="underline decoration-red-600">Tailwind is awsome</p>

    <!-- Border Colors -->
    <p class="border">border</p>
    <p class="border border-blue-600">Tailwind is awsome</p>

    <!-- Divide Colors -->
    <div class="divide-y divide-blue-500">
      <div>item 1</div>
      <div>item 2</div>
      <div>item 3</div>
      <div>item 4</div>
      <div>item 5</div>
    </div>
    <!-- Outline Colors -->
    <button class="outline outline-red-500">hi!</button>
    <button class="outline outline-zinc-500">hi!</button>
    <button class="outline outline-slate-500">hi!</button>
    <!-- Box Shadow Colors (Opacity defaults to 100, but you can set it)-->
    <button class="shadow-lg bg-cyan-500 shadow-purple-500/50">
      subscribe!
    </button>
    <!-- Accent Colors -->
    <input type="checkbox" class="accent-purple-500" checked />
    <input type="checkbox" class="accent-cyan-500" checked />

    <!-- Arbitrary Colors -->

    <div class="bg-[#426fab]">Hello</div>
    <div class="bg-[steelblue]">Hello</div>
    <div class="bg-[rgba(255,0,0,0.5)]">Hello</div>
  </body>
</html>
